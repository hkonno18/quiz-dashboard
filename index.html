.rb{height:100%;border-radius:100px;}
.rst{display:flex;gap:.8rem;font-family:"DM Mono",monospace;font-size:.7rem;color:var(--text3);}
.rscore{color:var(--text);font-weight:600;}

  <div class="kpi purple"><div class="kpi-lbl">トップスコア</div><div class="kpi-val" style="color:var(--purple);font-size:1.2rem">${topR?topR.name:'−'}</div><div class="kpi-sub">${topR?topR.total+'点（'+topR.date.slice(5).replace('-','/')+'）':'−'}</div></div>
</div>
<div class="sec">── グラフ分析</div>
<div class="grid2">
  <div class="card"><div class="ct"><span></span>メンバー別 累計正解数</div><div class="cw"><canvas id="c1"></canvas></div></div>
  <div class="card"><div class="ct"><span></span>日別 平均正答率の推移</div><div class="cw"><canvas id="c2"></canvas></div></div>
</div>
<div class="grid3">
  <div class="card"><div class="ct"><span></span>メンバー別 平均正答率</div><div class="cw"><canvas id="c3"></canvas></div></div>
  <div class="card"><div class="ct"><span></span>スコア分布</div><div class="cw"><canvas id="c4"></canvas></div></div>
  <div class="card"><div class="ct"><span></span>日別 参加人数</div><div class="cw"><canvas id="c5"></canvas></div></div>
</div>
<div class="sec">── 累計ランキング</div>
<div class="card" style="margin-bottom:1.5rem">${rankHTML}</div>
<div class="sec">── 分析インサイト</div>
<div class="ins-grid">
  <div class="ins ${overallRate>=50?'good':'warn'}"><div class="ins-em">${overallRate>=50?'📈':'⚠️'}</div><div class="ins-t">全体正答率</div><div class="ins-b">全体正答率は<strong>${overallRate}%</strong>。${overallRate>=67?'良好なペースです！':overallRate>=40?'もう一息！':'複数選択問題の対策が必要です。'}</div></div>
  <div class="ins ${lastRate>firstRate?'good':'info'}"><div class="ins-em">${lastRate>firstRate?'🚀':'📊'}</div><div class="ins-t">スコア推移</div><div class="ins-b">初日<strong>${firstRate}%</strong>→最新<strong>${lastRate}%</strong>。${lastRate>firstRate?'着実に上昇中🎉':'解説の共有が効果的かも。'}</div></div>
  <div class="ins good"><div class="ins-em">🏆</div><div class="ins-t">トップパフォーマー</div><div class="ins-b"><strong>${ml[0]?.name||'−'}</strong>が累計<strong>${ml[0]?.total||0}点</strong>でリード。満点は全体で<strong>${perfectCount}回</strong>達成。</div></div>
  <div class="ins info"><div class="ins-em">👥</div><div class="ins-t">参加状況</div><div class="ins-b"><strong>${dates.length}日間</strong>実施、1日平均<strong>${Math.round(data.length/Math.max(dates.length,1))}名</strong>参加。継続がカギです。</div></div>
  <div class="ins ${lowestM?.avgRate<34?'warn':'info'}"><div class="ins-em">💡</div><div class="ins-t">フォローアップ</div><div class="ins-b"><strong>${lowestM?.name||'−'}</strong>の平均正答率<strong>${lowestM?.avgRate||0}%</strong>。朝の解説シェアが効果的です。</div></div>
  <div class="ins info"><div class="ins-em">🎯</div><div class="ins-t">入力フォーマット</div><div class="ins-b">複数選択は<strong>「A,B,C」形式</strong>で入力。入力ミスによる不正解に注意。</div></div>
</div>
<div class="sec">── 全回答一覧</div>
<div class="card"><table><thead><tr><th>回答日</th><th>メンバー</th><th>問1</th><th>問2</th><th>問3</th><th>合計</th><th>正答率</th></tr></thead><tbody>${tableHTML}</tbody></table></div>
`;

Chart.defaults.color='#94a3b8';
Chart.defaults.font.family="'DM Mono',monospace";
Chart.defaults.font.size=11;

new Chart(document.getElementById('c1'),{type:'bar',data:{labels:ml.map(m=>m.name),datasets:[{data:ml.map(m=>m.total),backgroundColor:ml.map((_,i)=>COLORS[i%COLORS.length]+'99'),borderColor:ml.map((_,i)=>COLORS[i%COLORS.length]),borderWidth:1.5,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1e2d45'},ticks:{maxRotation:30,font:{size:10}}},y:{grid:{color:'#1e2d45'},beginAtZero:true,ticks:{stepSize:1}}}}});
new Chart(document.getElementById('c2'),{type:'line',data:{labels:dlabels,datasets:[{data:davg,borderColor:'#06b6d4',backgroundColor:'rgba(6,182,212,0.1)',borderWidth:2.5,pointBackgroundColor:'#06b6d4',pointRadius:5,tension:0.3,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1e2d45'}},y:{grid:{color:'#1e2d45'},min:0,max:100,ticks:{callback:v=>v+'%'}}}}});
new Chart(document.getElementById('c3'),{type:'bar',data:{labels:ml.map(m=>m.name),datasets:[{data:ml.map(m=>m.avgRate),backgroundColor:ml.map(m=>m.avgRate>=67?'rgba(16,185,129,0.7)':m.avgRate>=40?'rgba(59,130,246,0.7)':'rgba(239,68,68,0.6)'),borderColor:ml.map(m=>m.avgRate>=67?'#10b981':m.avgRate>=40?'#3b82f6':'#ef4444'),borderWidth:1.5,borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1e2d45'},min:0,max:100,ticks:{callback:v=>v+'%'}},y:{grid:{display:false},ticks:{font:{size:10}}}}}});
new Chart(document.getElementById('c4'),{type:'doughnut',data:{labels:['0点','1点','2点','3点'],datasets:[{data:scoreDist,backgroundColor:['rgba(239,68,68,0.8)','rgba(245,158,11,0.8)','rgba(59,130,246,0.8)','rgba(16,185,129,0.8)'],borderColor:['#ef4444','#f59e0b','#3b82f6','#10b981'],borderWidth:1.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{padding:12,font:{size:11}}}},cutout:'65%'}});
new Chart(document.getElementById('c5'),{type:'bar',data:{labels:dlabels,datasets:[{data:dpart,backgroundColor:'rgba(139,92,246,0.7)',borderColor:'#8b5cf6',borderWidth:1.5,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1e2d45'}},y:{grid:{color:'#1e2d45'},beginAtZero:true,ticks:{stepSize:1}}}}});
</script>
</body>
</html>
